name: release

# 打 tag（如 v1.2.0）并 push 后自动：校验版本一致 + 构建 APK（门禁）。
# 发布与差分补丁一律走本地（发版三步，AGENTS.md）：CI 沙箱的 debug keystore 与本地不同，
# v1.6.30 曾因 CI 自动发布导致签名不一致、全量用户更新被 Android 拒装——勿恢复 CI 发布。
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 校验 tag 与 build.gradle.kts 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          GRADLE_VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$TAG" != "$GRADLE_VER" ]; then
            echo "tag v$TAG 与 versionName $GRADLE_VER 不一致，请修改后重新打 tag"; exit 1
          fi

      - name: 构建 APK（门禁：编译通过即可；发布一律本地）
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
