name: release

# 打 tag（如 v1.2.0）并 push 后自动：构建 APK → 生成增量补丁与 manifest → 发布 GitHub Release
# 前提：app/build.gradle.kts 里的 versionName 与 tag 一致（workflow 会校验）
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 校验 tag 与 build.gradle.kts 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          GRADLE_VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$TAG" != "$GRADLE_VER" ]; then
            echo "tag v$TAG 与 versionName $GRADLE_VER 不一致，请修改后重新打 tag"; exit 1
          fi

      - name: 构建 APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成差分补丁与 manifest
        run: |
          pip install numpy
          cp app/build/outputs/apk/debug/app-debug.apk "update-server/apks/BrainQuest-${GITHUB_REF_NAME}.apk"
          cd update-server && python release.py
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: 发布到 GitHub Releases
        run: python tools/publish_github.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
