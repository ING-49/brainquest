name: release

# 打 tag（如 v1.2.0）并 push 后自动：构建 APK → 生成增量补丁与 manifest → 发布 GitHub Release
# 前提：app/build.gradle.kts 里的 versionName 与 tag 一致（workflow 会校验）
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 校验 tag 与 build.gradle.kts 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          GRADLE_VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$TAG" != "$GRADLE_VER" ]; then
            echo "tag v$TAG 与 versionName $GRADLE_VER 不一致，请修改后重新打 tag"; exit 1
          fi

      - name: 拉取历史版本的 APK（保证差分补丁连续）
        run: |
          for tag in $(gh release list --json tagName --jq '.[].tagName' | grep -v "^${GITHUB_REF_NAME}$"); do
            gh release download "$tag" -p "BrainQuest-*.apk" -D update-server/apks --clobber || true
          done
          ls -la update-server/apks/

      - name: 构建 APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 恢复正式签名配置（如已配置 Secrets）
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            mkdir -p keystore
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/brainquest-release.keystore
            cat > keystore/keystore.properties <<EOF
          storeFile=keystore/brainquest-release.keystore
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF
            echo "签名配置已恢复"
          else
            echo "未配置签名 Secrets，使用 debug 签名"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成差分补丁与 manifest
        run: |
          pip install numpy
          cp app/build/outputs/apk/debug/app-debug.apk "update-server/apks/BrainQuest-${GITHUB_REF_NAME}.apk"
          cd update-server && python release.py
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: 发布到 GitHub Releases
        run: python tools/publish_github.py
